<!doctype html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Two families, and only two. Inter carries the page: 200 for the hero's hairline
    headline, 300 for the section titles, 400/500/600 for body, cards and the filled
    controls. Instrument Serif is loaded upright only (the italic axis went with the
    editorial pass that used it) and has exactly one job: the story panel, the single
    printed surface in the scroll.

    Space Mono was here too. It set the 3D object's part labels and nothing else; the
    object was deleted earlier on this branch and the family has been requested for no
    glyph on the page ever since, left in place pending "a styling call for a later
    task". The design pass is that task, so the request goes, along with --font-mono and
    the two --mono-* sizes in base.css.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/sections.css" />
</head>
<body data-page="media">
  <canvas id="gradient" aria-hidden="true"></canvas>
  <main id="content"></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
