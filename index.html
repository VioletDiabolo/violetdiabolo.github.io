  <!--
    Inter carries the page: 200 for the hero's hairline headline, 300 for the section
    titles, 400/500/600 for body, cards and the filled controls. Instrument Serif is
    loaded upright only (the italic axis went with the editorial pass that used it) and
    has exactly one job left: the panel room, the single printed surface in the scroll.
    Space Mono was the 3D part labels' and nothing else's; the object is gone (this
    branch), so nothing on the page sets --font-mono any more. Left loaded rather than
    pulled here, since deciding whether it survives is a styling call for a later task.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@200;300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
