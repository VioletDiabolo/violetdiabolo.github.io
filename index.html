<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Violet Diabolo</title>
  <meta name="description" content="Premier Diabolo Team at NYU" />
  <link rel="icon" href="./favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Inter carries the page: 200 for the hero's hairline headline, 300 for the section
    titles, 400/500/600 for body, cards and the filled controls. Instrument Serif is
    loaded upright only (the italic axis went with the editorial pass that used it) and
    has exactly one job left: the panel room, the single printed surface in the scroll.
    Space Mono is the 3D part labels' and nothing else's.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@200;300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/stage.css" />
  <link rel="stylesheet" href="./src/styles/sections.css" />
</head>
<body>
  <div id="stage">
    <canvas id="renderer" aria-hidden="true"></canvas>
    <div id="label-layer"></div>

    <!--
      Shown only when html[data-stage="unsupported"] (src/fallback/detect.js found no
      WebGL context). Built from the same two-mirrored-bowl / gasket-pair / hub-cone /
      axle assembly the 3D scene renders, and drawn the same way it is: near-black fills
      from PART_COLORS and bright strokes from EDGE_COLORS (src/diabolo/materials.js),
      so this reads as the same object rather than a placeholder for it. The gaskets keep
      the object's one colour. The construction centreline that used to run down the
      middle went with the technical-drawing language the page no longer speaks.
    -->
    <!--
      No role/aria-label here: this SVG is purely decorative -- the page's text content
      already conveys everything -- so it carries its own aria-hidden directly (#stage
      itself no longer does: #label-layer, its sibling, holds genuine, readable content).
    -->
    <svg class="stage-fallback" viewBox="0 0 320 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- top bowl (cupTop): neck at the waist, rim flaring out at the top -->
      <path d="M142,230 C136,165 100,90 32,32 Q160,8 288,32 C220,90 184,165 178,230 Z"
            fill="#0c0a12" stroke="#efeaf8" stroke-width="1.5" />
      <!-- the rim, seen open: the circle EdgesGeometry draws around the lathe's mouth -->
      <ellipse cx="160" cy="27" rx="128" ry="19" fill="#0c0a12" stroke="#efeaf8" stroke-width="1.5" />

      <!-- top gasket: the object's one colour -->
      <rect x="136" y="228" width="48" height="16" rx="6" fill="#cf2f2a" stroke="#ff6a62" stroke-width="1.5" />

      <!-- top hub cone, narrowing into the bearing -->
      <path d="M136,244 L184,244 L176,286 L144,286 Z" fill="#08070c" stroke="#b9b4c6" stroke-width="1.5" />

      <!-- axle bearing, centred -->
      <rect x="144" y="286" width="32" height="28" rx="3" fill="#14131a" stroke="#f2f4f8" stroke-width="1.5" />

      <!-- bottom hub cone, mirrored -->
      <path d="M144,314 L176,314 L184,356 L136,356 Z" fill="#08070c" stroke="#b9b4c6" stroke-width="1.5" />

      <!-- bottom gasket -->
      <rect x="136" y="356" width="48" height="16" rx="6" fill="#cf2f2a" stroke="#ff6a62" stroke-width="1.5" />

      <!-- bottom bowl (cupBottom): mirror of the top bowl -->
      <path d="M142,372 C136,437 100,512 32,568 Q160,592 288,568 C220,512 184,437 178,372 Z"
            fill="#0c0a12" stroke="#efeaf8" stroke-width="1.5" />
      <ellipse cx="160" cy="573" rx="128" ry="19" fill="#0c0a12" stroke="#efeaf8" stroke-width="1.5" />
    </svg>
  </div>
  <main id="content"></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
