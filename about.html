  <!--
    One family. Inter carries every page: 400 for the hero wordmark, 700 for the headings,
    300 to 600 for body, cards and the filled controls.

    Instrument Serif was here too, with exactly one job: the prose of the About panel,
    the one printed surface on the old single-page site. That panel is gone -- About is a
    page of its own now, set in the same Inter as everything else after the client's
    team-page reference -- and a page does not ask for a webfont it has no glyph to set.

    The four page files are identical but for the title, the description and body's
    data-page, which is what src/main.js renders from. tests/pages.test.js holds them to
    that, so a fix made to one head cannot quietly miss the other three.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script type="module" crossorigin src="./assets/main-BBD93c1k.js"></script>
